[package]
name = "stelle"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A self-hostable, scriptable homelab dashboard"

[dependencies]
anyhow = "1.0"
axum = "0.8"
mlua = { version = "0.12", features = ["luau", "vendored", "send", "serialize"] }
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
