widgets:
  - type: lua
    id: stelle-github
    script: widgets/github-stats.luau
    cache_ttl: 300
    network_allow:
      - https://api.github.com

  - type: link
    label: YouTube
    description: Watch videos and subscriptions
    url: https://www.youtube.com
    accent: "#ff0033"

  - type: lua
    id: proxmox
    script: widgets/proxmox.luau
    cache_ttl: 180
    network_allow:
      - https://proxmox.example.com:8006
    settings:
      title: Proxmox
      base_url: https://proxmox.example.com:8006
      token_id: "stelle@pve!dashboard"
      token_secret: REPLACE_WITH_PROXMOX_API_TOKEN_SECRET

  - type: traefik
    id: traefik-services
    api_url: https://traefik.example.com
    cache_ttl: 300
    exclude_hosts:
      - stelle.example.com
